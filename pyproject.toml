[project]
name = "salesfaqbot"
version = "1.0.1"
description = "A sales FAQ chatbot application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ckip-transformers>=0.3.4",
    "fastapi>=0.125.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "G", "UP", "N", "B", "PTH", "SIM", "ANN"]
ignore = ["D100", "D203", "D213"]
